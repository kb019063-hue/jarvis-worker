  # The sanitizer run, as jobs side by side.
  #
  # Until 20 November this was one job, "Address/UB sanitizers + parser
  # fuzzing": `make tsan`, then `make asan-core` as one step, then `make
  # asan-deep`. It took 21 to 28 minutes while every other job of a run was
  # done in six, so a run was as long as that one job, and everything after a
  # push waited for it.
  #
  # Nothing was taken out to make it shorter. `asan-core` is nine parts in the
  # Makefile (it still runs all nine, in the old order, for `make asan`), and
  # the jobs below run those nine parts, `asan-deep` and `tsan` between them,
  # each part once, with the options, counts, floors and timeouts they had.
  # tools/ci/check_ci_parts.py, a step of "Build & unit tests", fails the run
  # if a part of `asan-core` is in no job or in two.
  #
  # Which part is in which job is decided by how long the parts take and by
  # nothing else (AGENTS.md has the times): each job is the build and four
  # to five minutes of checks. To add a check, put it in the part of the
  # Makefile it belongs with. To move a part to another job, move its step;
  # `asan-fuzz` needs the documents of the XML suite unpacked before it (the
  # step of its job says why).
  sanitizers-unit:
    name: "Sanitizers: unit suites"
    runs-on: ubuntu-latest
    # Not in the short run of a pull request. After the last merge of a lot it
    # builds and keeps the objects, and leaves the suites out (the top of this
    # file).
    if: ${{ !(github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'lot') || startsWith(github.event.pull_request.title, 'WIP:')) && !startsWith(github.event.pull_request.title, 'WATCH:')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile through ccache, with the objects of main's last run
        uses: ./.github/actions/ccache
        with:
          objects: asan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Address randomisation the sanitizers can live with
        # See the string stress tests in the last of these jobs. Every
        # sanitizer step has always run after this setting, so each job makes
        # it before it builds.
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Sanitizer build
        # Each of these jobs makes build-asan/litebird for itself: a job starts
        # on a clean machine, and passing the build between jobs would put it
        # in front of all of them instead of beside them. From nothing it is
        # five to six minutes; with the objects of main's last run (the
        # ccache step above) it compiles what the pull request changed.
        # In this job the binary of the unit suites is built in the same
        # `make` (ASAN_BUILD_ALSO, the Makefile): one compiler needs 147
        # seconds for it, and it used to start when the engine was built.
        # Not after the last merge of a lot: that run leaves the suites
        # out, and the binary's object is the one ccache is not given
        # (TEST_OBJ, the Makefile), so no later run would have it.
        env:
          ASAN_OPTIONS: detect_leaks=0
          ALSO: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) && 'build-asan/test_suite' || '' }}
        run: |
          set -o pipefail
          make -j"$(nproc)" asan-build ASAN_BUILD_ALSO="$ALSO" 2>&1 | tee "$RUNNER_TEMP/part-asan-build.log"
      - name: What ccache had for it, as a notice on the run
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "::notice title=ccache, asan build::$(ccache -s 2>/dev/null | grep -E 'Cacheable calls|Hits|Misses|Cache size' | tr -s ' ' | tr '\n' ';')"
          fi
      - name: Keep the objects for the runs that follow
        # A run on main saves them: every pull request can read what
        # such a run saved, and nobody else what a pull request's run
        # did. A watch's own pull request saves them too, for itself:
        # its next lot is pushed a minute after this one has landed,
        # before main's run has saved anything, and holds the same
        # carried pull requests again (.github/actions/ccache/action.yml).
        if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, 'WATCH:')
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-asan-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Unit suites in the sanitizer build
        if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
        # The longest part, and the reason the suites are run a second time: a
        # suite that passes in the normal build can fail in this one.
        env:
          ASAN_OPTIONS: detect_leaks=0
        # As six processes (ASAN_UNIT_STRETCHES, the Makefile): as one,
        # this step took 8 min 52 s and was the length of the run. As three
        # equal stretches it was still 5 min 22 s of suites, one stretch of
        # 322 seconds beside two of 22 and 24, so the stretches now begin
        # where UNIT_SUITE_CUTS in the Makefile says: four side by side,
        # and the two that hold the deep suites when those have ended
        # (UNIT_SUITE_LATE), because beside them a suite that measures time
        # ran out of it. That was 117 seconds of suites in one run and 245
        # in the next, on a slower machine (45473629683, 45475379777).
        # A stretch that fails beside the others and has no sanitizer's
        # report is run once more by itself; if it passes then, the job
        # passes with a warning that names it. The second of those runs
        # was the first to need that: a suite's bound of five seconds,
        # which the sanitizer build has since been given more of.
        # The step ends with a notice on the job: the time and the memory
        # of each stretch, and the slowest suites of the slowest.
        run: |
          set -o pipefail
          make -j"$(nproc)" asan-unit ASAN_UNIT_STRETCHES=balanced 2>&1 | tee "$RUNNER_TEMP/part-asan-unit.log"
      - name: What failed, as annotations
        # A job's log is served by another host than the API, and a failure
        # here has had nothing but `exit code 2` to go by where the log could
        # not be fetched (finding 49). The annotations of a job are served by
        # the API itself:
        #   gh api repos/OWNER/REPO/check-runs/JOB_ID/annotations --jq '.[].message'
        # Each step keeps its output in a file of its own, and the step that
        # failed is the last one that wrote one, so the newest file is read.
        if: failure()
        run: python3 tools/ci/annotate_failure.py "$(ls -t "$RUNNER_TEMP"/part-*.log 2>/dev/null | head -n 1)"

