name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - name: Engine test suites
        run: make test
      - name: Smoke-test the CLI
        run: ./build/litebird examples/hello.html --dump-dom-webplatform

  conformance:
    name: DOM conformance (html5lib corpus)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: make -j"$(nproc)"
      - name: Tree-construction scoreboard
        run: make conformance
      - name: Enforce the conformance floor
        # The corpus is fixed, so the score is deterministic. Raise this floor as
        # the parser improves; it exists to catch regressions.
        #
        # NOTE: this used to be a bare multi-line `run:` value whose second line
        # started at column 1, which is not valid YAML. The whole workflow file
        # failed to parse, so every run reported "workflow file issue" and no job
        # ever executed. Keep it as a block scalar.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_tree_construction.py --quiet --json build/conformance.json
          python3 -c "import json,sys; r=json.load(open('build/conformance.json')); print(f\"conformance: {r['passed']}/{r['total']} = {r['rate']:.1f}%\"); sys.exit(0 if r['rate'] >= 98.0 else 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: build/conformance.json

  sanitizers:
    name: Address/UB sanitizers + parser fuzzing
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sanitizer build, tests and fuzz smoke run
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set +e
          CXXF="-std=c++20 -O1 -g -Wall -Wextra -Iinclude -MMD -MP -fsanitize=address,undefined -fno-omit-frame-pointer"
          ASAN_OPTIONS=detect_leaks=0 make BUILD_DIR=build-asan CXXFLAGS="$CXXF" all > /tmp/b.log 2>&1
          echo "::error::BUILD_EXIT=$?"
          LITEBIRD_DEBUG_STACK=1 ASAN_OPTIONS=detect_leaks=0 make BUILD_DIR=build-asan CXXFLAGS="$CXXF" test > /tmp/t.log 2>&1
          TE=$?
          echo "::error::TEST_EXIT=$TE ulimit_s=$(ulimit -s) nproc=$(nproc)"
          tail -25 /tmp/t.log
          grep -E "^\[stack\]" /tmp/t.log | head -3 | while IFS= read -r l; do echo "::error::STACK $l"; done
          awk '/deeply_nested_markup_does_not_overflow_the_stack/{f=1} f&&/^\[bb\]/{print; n++} n>=8{exit}' /tmp/t.log | while IFS= read -r l; do echo "::error::BB $l"; done
          grep -n "deeply_nested" /tmp/t.log | head -2 | while IFS= read -r l; do echo "::error::WHERE $l"; done
          grep -iE "runtime error|ERROR: AddressSanitizer|SUMMARY|Assertion|FAILED|DEADLYSIGNAL" /tmp/t.log | head -8 | while IFS= read -r l; do echo "::error::DIAG $l"; done
          tail -60 /tmp/t.log | while IFS= read -r l; do echo "::error::TAIL $l"; done
          ASAN_OPTIONS=detect_leaks=0 make BUILD_DIR=build-asan fuzz > /tmp/f.log 2>&1
          echo "::error::FUZZ_EXIT=$?"
          tail -12 /tmp/f.log
          exit $TE
