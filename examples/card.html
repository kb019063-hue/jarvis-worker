<!DOCTYPE html>
<html>
<head>
    <title>Card Component</title>
    <style>
        body {
            background-color: #282a36;
            color: #f8f8f2;
            padding: 16px;
        }
        .card {
            background-color: #44475a;
            border: 2px #bd93f9;
            padding: 14px;
            width: 480px;
            margin: 10px;
        }
        .card-header {
            color: #50fa7b;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .card-body {
            color: #f1fa8c;
            margin-bottom: 10px;
        }
        .badge {
            color: #ff79c6;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">Modular Architecture</div>
        <div class="card-body">
            This card demonstrates CSS selector cascade, box-model borders, padding, and text layout.
        </div>
        <p class="badge">Engine: C++20 Box Model</p>
    </div>
</body>
</html>
