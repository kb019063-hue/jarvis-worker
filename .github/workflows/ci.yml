name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `unlabeled` is here for one label, `lot` (below): taking it off a pull
    # request starts the whole of CI on its head.
    types: [opened, synchronize, reopened, unlabeled]
  # Lets anyone with a token that can read the repository start this workflow
  # by hand (Actions UI or `gh workflow run ci.yml --ref main`), e.g. to
  # re-check main after a flaky job, instead of pushing an empty commit.
  # Runs the same jobs as a push to main; nothing about the checks changes.
  workflow_dispatch:

# A newer run of the same pull request stops the older one. Until 22 November
# 2026 nothing did: every push started twelve jobs that ran to their end, and on
# 21 November 16 of the 98 runs of pull requests were overtaken by a newer push
# to the same pull request while they were still going. Nobody reads the result
# of a run on a commit that is no longer the head, and the jobs it holds are jobs
# another pull request waits for.
# A run that is not a pull request's (a push to `main`, one started by hand) is
# alone in its group, which is its own run id: nothing stops it, and each commit
# of `main` still gets its whole run.
#
# Every job starts at once. Until 24 November 2026 ten of the twelve waited for
# "Build & unit tests" (`needs:`), five minutes in which a run did nothing
# else: a run was those five minutes and then its longest job, 17.6 minutes
# on `main` that night (run 45293924439) where the longest job took 12.5. The
# wait saved runner time only when the build or a unit suite failed, and the
# agents run both before they push.
#
# Two kinds of run leave jobs out, since 24 November 2026. A run was twelve
# jobs then, and no more than twenty were seen running at once: at 04:57 that
# night 19 were running and 25 were waiting for a runner, in six runs, and
# the lot every finished pull request was waiting for had eight jobs that
# had not started 4.7 minutes after its push. A pull request was being tested
# three times over: by its own run, by the lot's, and by the run on `main`
# after the lot.
#
# - **The short run of a pull request that has the label `lot`, or whose
#   title begins with `WIP:`**: the jobs
#   of the plain build that take a minute or two ("Build & unit tests",
#   "Documentation shape", the reftests, and the four corpus jobs: html5lib,
#   JavaScript, script DOM and URLs, XML and web-platform-tests). The
#   sanitizer jobs and the deep pages, which are the long ones, are skipped.
#   The landing session puts the label on while a watch is on
#   (`tools/watch/watch.sh look`), because the whole of CI then runs on the
#   lot the pull request lands in, on `main` as it will be, which its own
#   run never saw. A watch's own pull request (`WATCH:`) always gets every
#   job. With no watch, `python3 tools/ci/check_pr.py merge N` takes the
#   label off before it says "ready", which starts every job (`unlabeled`,
#   above): nothing is merged by its own agent on a short run.
#
#   `WIP:` in the title is here because the label comes too late for the run
#   that needs it least. The landing session looks every few minutes, and a
#   pull request's first push is before any look: at 18:10 UTC on 24
#   November three pull requests that had just been opened each started all
#   fourteen jobs, and the lot of 18:12, which one finished pull request was
#   waiting for, had ten jobs without a runner two and a half minutes after
#   its push (no more than twenty run at once). Work in progress is not
#   merged on any run; when the `WIP:` is off, every job runs before a merge:
#   in the lot while a watch is on, and with no watch because `merge N`
#   starts them (it puts the label on and takes it off when there is none).
#
#   For its first four hours the short run was the first two of those jobs
#   and no more. On 24 November two lots in a row failed for it (pushed
#   08:38 and 08:44 UTC): #368 failed one case of the html5lib corpus and
#   #366 was in both, their own runs were green because those jobs were not
#   in them, and the lot's run names the job that failed and not the pull
#   request. Three others waited sixteen minutes more, and which of the two
#   it was had to be found by building each alone. The corpus jobs take 12
#   to 70 seconds each when the objects are in ccache; with them in its own
#   run, a pull request that breaks a corpus fails by itself, within two
#   minutes of its push, and `watch.sh lot` says which one it was.
# - **The run on `main` after the last merge of a lot** (`[objects only]` in
#   that merge's message, written by `tools/watch/watch.sh land`): the lot's
#   run passed every job on that very tree minutes before. What this run is
#   for is the compiled objects every pull request's runs start from, so it
#   builds twice, keeps them, and runs the unit suites of the plain build.
#
# Every other run is every job: a push to `main` that is not that merge, a
# run started by hand, a pull request without the label.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
        # job to say as annotations (tools/ci/logged.sh says why).
        shell: bash tools/ci/logged.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Compile through ccache, with the objects of main's last run
        uses: ./.github/actions/ccache
        with:
          objects: plain
      - name: The published numbers are still true
        # README.md said 1124 / 1150 (97.6%) while the two integers divide to
        # 97.7, and ROADMAP.md's baseline quoted a corpus two phases old. This
        # derives what can be derived — the arithmetic, the two corpus totals,
        # the suite count — instead of trusting a sentence. Seconds, not
        # minutes: it runs before the build so a wrong number fails first.
        # The suite count is the one it only reports: README.md is allowed to
        # be behind, because no pull request edits that count any more.
        run: make check-numbers
      - name: Every part of the sanitizer run has a job
        # `make asan-core` is nine parts in the Makefile, and the jobs at the
        # end of this file run them side by side. A part that is in
        # the Makefile and in no job would fail nothing: the run would be
        # green and the check not made. This step fails instead. It reads the
        # two files and needs no build.
        run: |
          python3 tools/ci/check_ci_parts.py --self-test
          python3 tools/ci/check_ci_parts.py
      - name: Build
        run: make -j"$(nproc)"
      - name: What ccache had for it, as a notice on the run
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "::notice title=ccache, plain build::$(ccache -s 2>/dev/null | grep -E 'Cacheable calls|Hits|Misses|Cache size' | tr -s ' ' | tr '\n' ';')"
          fi
      - name: Keep the objects for the runs that follow
        # A run on main saves them: every pull request can read what
        # such a run saved, and nobody else what a pull request's run
        # did. A watch's own pull request saves them too, for itself:
        # its next lot is pushed a minute after this one has landed,
        # before main's run has saved anything, and holds the same
        # carried pull requests again (.github/actions/ccache/action.yml).
        if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.title, 'WATCH:')
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-plain-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Engine test suites
        run: make test
      - name: Shell labels cannot inject terminal controls
        run: make verify-terminal-shell-safety
      - name: Worker error diagnostics cannot inject terminal controls
        run: make verify-worker-terminal-safety
      - name: Uncaught JavaScript diagnostics cannot inject terminal controls
        run: make verify-js-error-terminal-safety
      - name: CLI file and navigation errors cannot inject terminal controls
        run: make verify-cli-error-terminal-safety
      - name: A page's own text cannot inject terminal controls through a dump
        run: make verify-page-text-terminal-safety
      - name: CSS and paint dumps filter UTF-8 terminal controls
        run: make verify-css-paint-terminal-safety
      - name: Console output filters UTF-8 terminal controls
        run: make verify-console-terminal-safety
      - name: Pathless URL references agree with Node
        run: make verify-relative-navigation
      - name: Path-bearing URL references agree with Node
        run: make verify-path-resolution
      - name: GC invariants hold through the shell
        # Unreachable cycles and closure captures must be reclaimed, churn
        # must not grow the live set, what a global names must stay intact.
        # `make test` checks the same in-process; this checks the path the
        # shell takes. Seconds.
        run: make gc-oracle
      - name: Shaping comparator negative controls (not engine conformance)
        run: make shaping-oracle-self-test
      - name: Bidi conformance (Unicode's own two suites)
        run: make bidi-conformance
      - name: Encoding tables match whatwg/encoding's own index files
        # The tool behind `verify-encoding-tables` asks each decoder whether it
        # agrees with the table it reads, and a decoder and its table can be
        # wrong together. This fetches the standard's index files at a pinned
        # digest and compares all 91,441 positions. Shown to fail on three
        # injected defects (a single-byte entry, a Big5 pointer, a gb18030
        # range), each reported as one mismatch. Seconds once cached.
        run: make verify-encoding-index
      - name: Sized-float index keeps placements fast
        # Full CLI parse + layout + dump of packed, mixed-side, and cleared
        # 1k/10k floats. The old repeated band sweep takes 5-12 seconds at
        # 10k locally; indexed placement takes ~0.1 seconds.
        run: make bench-floats
      - name: Map and Set iterators preserve cursor semantics
        # Node-recorded Map/Set cases retain two live cursors through
        # compaction, insertion, clear, and a terminal next() result.
        run: make verify-collection-iterators
      - name: Map and Set completed iterators stay flat without gc
        # Two equal 8,192-loop batches run in one VM process. The later batch
        # may take at most 2.25 times the earlier one plus 40 ms; a cursor
        # registry that rescans every old iterator grows far beyond that.
        run: make bench-collections
      - name: Style-heavy inline pages share ComputedStyle
        # 100k repetitions of `word <b>bold</b>`, links, and styled spans.
        # Copying ComputedStyle inline per box/fragment took 602-1382 MiB RSS;
        # deduplicated SharedComputedStyle keeps peak RSS well under 500 MiB.
        run: make bench-styles
      - name: Smoke-test the CLI
        run: ./build/litebird examples/hello.html --dump-dom-webplatform
      - name: CSS whitespace stays linear and keeps the same paint
        # Ten parser/resolver paths, each at 30,000 and 300,000 spaces. Every
        # padded page is compared with its compact form; the old front-erasure
        # loops took over 20 s on the large cases. The limit is generous for
        # a shared runner but far below the quadratic cost.
        run: make bench-css
      - name: Attribute-list end removals stay linear
        # Six DOM cases at 50,000 attributes: front/back/alternating drains,
        # front-half update/reinsert, namespaces, and short-list churn. Each
        # must print the expected checksum; the old front erase took seconds.
        run: make bench-attributes
      - name: Tokenizer attribute names stay linear
        # Seven page shapes at 50,000 attribute occurrences: distinct names,
        # every name twice, uppercase repeats, long names, the four value
        # spellings, many small tags, and an end tag. Each dump must equal the
        # tree the markup means; the old per-name scan took 3.5 s on the wide
        # cases and the limit is 1 s.
        run: make bench-tokenizer-attributes
      - name: Page fetch cannot read arbitrary local files
        # A web document must not read a marker file by path, file: URL, or
        # relative reference; a file: document keeps local access.
        run: make security-fetch
      - name: HTTPS rejects untrusted and wrong-identity certificates
        run: make security-https
      - name: Worker MIME/static-module policy, EventTarget dispatch, and startup/exit stability
        # Verifies WHATWG JavaScript MIME enforcement over HTTP/data:, a static
        # module-worker graph, classic importScripts origin/MIME checks, error
        # listener dispatch, and 60x concurrent 4-worker startup/exit runs (0 crashes).
        run: make security-worker
      - name: WebSocket wss:// TLS, Fetch Origin/mixed-content policy, API validation, and teardown stability
        # Verifies wss:// TLS verification (CA, DNS SAN + SNI, IPv4 SAN, expired/wrong-SAN/untrusted/plaintext rejection),
        # Fetch Origin & mixed-content rules across https:/http:/file:/sandbox, relative URLs,
        # WHATWG DOMException validation/close semantics, and 60x concurrent wss:// exit stability.
        run: make security-websocket
      - name: JPEG, GIF, and SVG differential verification and mutation fuzzing
        # Verifies Baseline/Progressive JPEG and GIF87a/89a decoding pixel-by-pixel
        # against ImageMagick/libjpeg when available, real-world SVG rendering,
        # and runs 1,800 mutated JPEG/GIF/SVG inputs through media_check.
        run: |
          make verify-media
          make verify-avif
          make fuzz-media
      - name: Audio/Video, WebCodecs, and WebGL spec conformance oracle
        # Runs 25 spec-backed cases across HTMLMediaElement (<audio>/<video>),
        # MediaSource/Web Audio, WebCodecs, and WebGL 1/2 with KNOWN/FIXED gating
        # and 5 built-in negative controls.
        run: make verify-media-webgl-codecs
      - name: CSS Color 4/5 rational oracle, WPT vectors, and fuzzing
        # Cross-checks all 15 color spaces against an independent exact-rational
        # Python W3C CSS Color 4 oracle, verifies §13.2 OKLCH gamut mapping,
        # WPT valid/invalid computed vectors, and 5,000 adversarial fuzz inputs.
        run: |
          make verify-color
          make fuzz-color
      - name: RFC 7932 Brotli vector, bomb-cap, and mutation fuzz verification
        # Verifies pure C++20 RFC 7932 Brotli decoding across built-in edge
        # vectors, exact bomb-cap boundaries, invalid headers, and 2,000
        # truncation/bit-flip/random fuzz inputs (live Node differential checks
        # also run in js-conformance where Node 22 is provisioned).
        run: |
          make verify-brotli BROTLI_VERIFY_FLAGS=--skip-node
          make fuzz-brotli BROTLI_VERIFY_FLAGS=--skip-node
      - name: Collection at a safe point changes nothing a program can see
        # The negative control first (three cases the harness must be caught
        # failing on), then 28 corpus cases at three seeds, then the 678 DOM
        # pages at interval 2. The oracle is each program's own un-stressed
        # output; a case whose stress run served no collection fails, so this
        # cannot go green by not collecting. `make verify-gc-stress-full` runs
        # interval 1 over the whole JS corpus and is not in CI.
        run: make verify-gc-stress
      - name: What failed, as annotations
        # The failed step's output, cut to what matters, where the log
        # cannot be fetched (tools/ci/logged.sh kept it). `shell: bash`: this
        # step is not itself run through logged.sh.
        if: failure()
        shell: bash
        run: python3 tools/ci/annotate_failure.py "$(ls -t "$RUNNER_TEMP"/part-*.log 2>/dev/null | head -n 1)"


  docs:
    name: Documentation shape
    runs-on: ubuntu-latest
    # Not after the last merge of a lot (the top of this file). It is part of
    # the short run.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
        # job to say as annotations (tools/ci/logged.sh says why).
        shell: bash tools/ci/logged.sh {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the base branch, so it needs that ref and
          # not only the pull request's merge commit.
          fetch-depth: 0
      - name: Fetch the base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
      - name: next_ids parses what it is trusted for
        # The allocator reads phase and finding numbers out of prose that was
        # not written for it. These are the cases it is trusted for, and the
        # claim protocol is only as good as they are.
        run: python3 tools/next_ids.py --self-test
      - name: check_pr reads a claim the way AGENTS.md writes one
        # The lines a pull request opens with are read by the tool that says
        # "ready" before a merge. These are the forms it is trusted for, and
        # it asks GitHub nothing here.
        run: python3 tools/ci/check_pr.py --self-test
      - name: check_suites reads a suite's opening the way a merge does
        # Two branches that each add a suite sharing the six-line page prologue
        # merge into two conflict regions with the prologue outside both, so
        # "take ours" and "take theirs" each produce a function with the other's
        # body. These are the shapes it is trusted for, and it builds nothing.
        run: python3 tools/ci/check_suites.py --self-test
      - name: Every suite that runs script takes its page from TestPage
        # Not a failure while suites are being converted: the count is printed so
        # it can be watched. A suite that uses TestPage *and* sets its own URL is
        # a failure, because that is the helper's page used for another document.
        run: python3 tools/ci/check_suites.py
      - name: check_numbers reads a marked figure the way the documents write one
        # `make metrics` rewrites the text in front of every marker, and the
        # wrong shape there is a document rewritten and still plausible. These
        # are the figures and shapes it is trusted for, and it asks the tree
        # nothing here.
        run: python3 tools/ci/check_numbers.py --self-test
      - name: check_rows reads the table "Open tasks" the way a merge does
        # Two rows of that table that touch are two changes git cannot
        # merge. The tool that keeps an empty row between them is tested
        # here on small tables of its own; the table itself is only
        # reported on, by check_docs.py below.
        run: python3 tools/ci/check_rows.py --self-test
      - name: The watch's own tools read what they are given the way they say
        # carry_rows.py carries a pull request whose only conflict is a row
        # of "Open tasks"; run_stretches.py decides whether the unit suites,
        # run as several processes, were every suite. Both are tested on
        # fixed texts, and tools/watch/watch.sh must at least be a script.
        # logged.sh is the shell these very steps run in: it is tested on
        # small scripts for the exit status it gives and the file it keeps.
        run: |
          python3 tools/watch/carry_rows.py --self-test
          python3 tools/ci/run_stretches.py --self-test
          bash -n tools/watch/watch.sh
          bash tools/ci/logged.sh --self-test
      - name: The documents keep their shape and stay under their budgets
        # ARCHITECTURE.md is 84% phase write-ups and AUDIT.md is 53 resolved
        # findings of 61. Both are frozen as append targets; new write-ups go
        # in docs/ (AGENTS.md, "Notice — read this first"). The budgets come
        # down as the migration proceeds, never up to let a pull request pass.
        run: python3 tools/ci/check_docs.py
      - name: What failed, as annotations
        # The failed step's output, cut to what matters, where the log
        # cannot be fetched (tools/ci/logged.sh kept it). `shell: bash`: this
        # step is not itself run through logged.sh.
        if: failure()
        shell: bash
        run: python3 tools/ci/annotate_failure.py "$(ls -t "$RUNNER_TEMP"/part-*.log 2>/dev/null | head -n 1)"

  render-conformance:
    name: Render reftests (pixels)
    runs-on: ubuntu-latest
    # Not after the last merge of a lot (the top of this file). It is part of
    # the short run.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
        # job to say as annotations (tools/ci/logged.sh says why).
        shell: bash tools/ci/logged.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Compile through ccache, with the objects of main's last run
        uses: ./.github/actions/ccache
        with:
          objects: plain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: make -j"$(nproc)"
      - name: Two-build pixel comparator negative controls
        run: make diff-render-self-test
      - name: Reftests
        # `ROADMAP.md` Tier 1 row 8: "Nothing measures a pixel." This measures
        # them. Every page in tests/render/reftests.json is rendered, and the
        # PNG is read back by tools/conformance/render_check.py's own decoder —
        # the engine is not asked to grade its own writer — then compared with
        # what the reftest asserts, exactly, with no tolerance.
        run: make render-conformance
      - name: Compare a real build with itself
        run: make diff-render BEFORE=build/litebird AFTER=build/litebird DIFF_RENDER_ARGS="--filter inline_"
      - name: What failed, as annotations
        # The failed step's output, cut to what matters, where the log
        # cannot be fetched (tools/ci/logged.sh kept it). `shell: bash`: this
        # step is not itself run through logged.sh.
        if: failure()
        shell: bash
        run: python3 tools/ci/annotate_failure.py "$(ls -t "$RUNNER_TEMP"/part-*.log 2>/dev/null | head -n 1)"
  conformance:
    name: DOM conformance (html5lib corpus)
    runs-on: ubuntu-latest
    # Not after the last merge of a lot (the top of this file). It is part of
    # the short run.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
        # job to say as annotations (tools/ci/logged.sh says why).
        shell: bash tools/ci/logged.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Compile through ccache, with the objects of main's last run
        uses: ./.github/actions/ccache
        with:
          objects: plain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Tree-construction scoreboard
        run: make conformance
      - name: Enforce the conformance floor
        # The corpus is fixed, so the score is deterministic. Raise this floor as
        # the parser improves; it exists to catch regressions.
        #
        # NOTE: this used to be a bare multi-line `run:` value whose second line
        # started at column 1, which is not valid YAML. The whole workflow file
        # failed to parse, so every run reported "workflow file issue" and no job
        # ever executed. Keep it as a block scalar.
        #
        # The floor is 1,973 of the 1,973 cases of the corpus Phase 76 vendored
        # from web-platform-tests. Since Phase 95 the dump path runs the page's
        # scripts as the parser reaches them, and since Phase 101 Noah's Ark
        # compares the attributes on the tokens, so all six `scripted_*.dat`
        # cases pass. Any case that stops passing is a regression.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_tree_construction.py --quiet --json build/conformance.json
          python3 -c "import json,sys; r=json.load(open('build/conformance.json')); print(f\"conformance: {r['passed']}/{r['total']} = {r['rate']:.1f}%\"); sys.exit(0 if r['passed'] >= 1973 else 1)"
      - name: Random pages against parse5
        # The corpus is the inputs somebody wrote. This is 6,000 pages and
        # fragments nobody wrote, a few dozen misnested tags each, parsed here
        # and by parse5: no tree may differ. It is what found that <br/> closed
        # the paragraph it stood in, which no corpus case writes. parse5 8.1.1
        # is fetched from the npm registry into build/parse5 and compared in a
        # copy with nine rules corrected to the standard's
        # (tools/conformance/diff_trees.py says which and why).
        run: make diff-trees
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: build/conformance.json
      - name: What failed, as annotations
        # The failed step's output, cut to what matters, where the log
        # cannot be fetched (tools/ci/logged.sh kept it). `shell: bash`: this
        # step is not itself run through logged.sh.
        if: failure()
        shell: bash
        run: python3 tools/ci/annotate_failure.py "$(ls -t "$RUNNER_TEMP"/part-*.log 2>/dev/null | head -n 1)"

  js-conformance:
    name: JavaScript conformance (Node-verified corpus)
    runs-on: ubuntu-latest
    # Not after the last merge of a lot (the top of this file). It is part of
    # the short run.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
        # job to say as annotations (tools/ci/logged.sh says why).
        shell: bash tools/ci/logged.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Compile through ccache, with the objects of main's last run
        uses: ./.github/actions/ccache
        with:
          objects: plain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # The expectations in tests/js-conformance were recorded with Node 22.
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Check the corpus against Node.js
        # Every expected output must be what a real engine prints. If this step
        # fails, an expectation is wrong; it says nothing about Litebird.
        run: python3 tools/conformance/run_js_conformance.py --reference "node -e" --quiet
      - name: JavaScript scoreboard
        run: make js-conformance
      - name: Enforce the JavaScript floor
        # The corpus is fixed and timers run on a virtual clock, so the score
        # does not vary: 1085 of 1112 pass (raised by 65 in finding 69 with
        # tests/js-conformance/iteration.dat, 17 in finding 66 with
        # string_unicode.dat, 4 in finding 65 across construct.dat and
        # lexical.dat, and 25 in finding 61 with regexp_unicode.dat, on top
        # of finding 50/51/42/49).
        # 1128 of 1152 on 18 November: Phases 65 and 68 added 40 cases, and
        # 43 more pass than when the floor was last raised. It stayed at 1085
        # meanwhile, where 43 cases could have stopped passing without this
        # step saying so.
        # Raise the floor as the engine improves; it exists to catch regressions.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_js_conformance.py --quiet --json build/js-conformance.json --min-pass 1149
      - name: String-heavy scripts against Node.js
        # Each script does work in step with its input (read a long string once,
        # append to one many times). The limit is 3 s and the slowest takes a
        # fifth of a second, so this fails on a cost that grows with the square
        # of the length, not on a slow runner. It also compares results.
        run: make bench
      - name: Surrogate halves appended one at a time stay linear
        # Six scripts (20k, 40k, kept prefixes, read between halves, indexOf
        # between halves, and substring slice read then completed), best of
        # three, with a limit of one second against Node.js.
        run: make bench-surrogates
      - name: Promise combinators resolve before advancing the iterator
        # Four reference-checked adversarial cases in async.dat: an unbounded
        # iterator must be closed when resolve/then throws; the old walk
        # advanced forever before it looked at the first yielded value.
        run: make verify-promise-iterators
      - name: Generator delegation against Node.js
        run: python3 tools/conformance/verify_async_generator.py
      - name: Eval context, declaration instantiation, and early errors against Node.js
        run: python3 tools/conformance/verify_eval_context.py
      - name: With statements and object environment records against Node.js
        run: python3 tools/conformance/verify_with_statement.py
      - name: Promise subclass capabilities and chains against Node.js
        # 22 programs answering questions about NewPromiseCapability, species,
        # chain value propagation, thenable adoption and rejecting through a
        # `then` with no handler: each run through the engine and Node.js, and
        # the two outputs required to be equal, line for line (Phase 196).
        run: python3 tools/conformance/verify_promise_subclass.py
      - name: Garbage-collector residue is flat across loop sizes
        # 15 churn shapes -- promise reactions, chained reactions, bind, timers,
        # intervals and listeners -- each run at 200 and at 2,000 iterations,
        # requiring the residue after the queue drains to be the same at both
        # sizes. A leak grows with the loop; a backlog does not. The row this
        # replaces counted `alive_cells` mid-loop and read the queue's depth as
        # garbage (Phase 227, finding 231).
        run: python3 tools/conformance/verify_gc_residue.py
      - name: String results against Node.js
        # 36 subject strings through every string method and 51 regular
        # expressions: 50,580 results, each compared with what Node computes on
        # the spot. Phase 55 dropped the ceiling from 95 to 71; Phase 60 landed
        # Unicode 17.0 normalization, full/locale case mapping, and CLDR 48 root
        # collation, bringing the ceiling to 0 (50,580/50,580 equal to Node).
        run: make diff-strings
      - name: RegExp Unicode 17.0, v-mode, d-mode, and ES2025 differential & spec verification
        # Cross-checks 88 curated + 500 seeded fuzz Unicode/v-mode/d-mode
        # RegExp patterns against Node.js (0 discrepancies) plus 112 direct
        # ES2025 assertions (modifiers, duplicate named groups, RegExp.escape).
        run: make verify-regexp
      - name: String Unicode 17.0 normalization, case mapping, and CLDR 48 collation verification
        # Exhaustively sweeps all 1,114,112 code points x 11 ops (12.25M checks),
        # 1,112 curated+fuzz multi-char strings, 1,038 collation pairs, and 25
        # ECMA-262/ECMA-402 validation checks against Node.js (0 discrepancies).
        run: make verify-string-unicode
      - name: RFC 7932 Brotli differential verification against Node.js zlib
        # Differential-tests quality 0..11, window bits 10..24, all modes,
        # >1 MiB streams, dictionary transforms, bomb caps, and 2,000 fuzzed
        # inputs against Node 22 zlib.brotliCompressSync.
        run: |
          make verify-brotli
          make fuzz-brotli
      - uses: actions/upload-artifact@v4
        with:
          name: js-conformance-report
          path: build/js-conformance.json
      - name: What failed, as annotations
        # The failed step's output, cut to what matters, where the log
        # cannot be fetched (tools/ci/logged.sh kept it). `shell: bash`: this
        # step is not itself run through logged.sh.
        if: failure()
        shell: bash
        run: python3 tools/ci/annotate_failure.py "$(ls -t "$RUNNER_TEMP"/part-*.log 2>/dev/null | head -n 1)"

  dom-conformance:
    name: Script DOM conformance (jsdom-verified corpus) and URLs (web-platform-tests)
    runs-on: ubuntu-latest
    # Not after the last merge of a lot (the top of this file). It is part of
    # the short run.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
        # job to say as annotations (tools/ci/logged.sh says why).
        shell: bash tools/ci/logged.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Compile through ccache, with the objects of main's last run
        uses: ./.github/actions/ccache
        with:
          objects: plain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # jsdom 31, which recorded the expectations, needs Node 20 or later.
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Check the corpus against jsdom
        # Every expected output must be what jsdom prints. If this step fails,
        # an expectation is wrong; it says nothing about Litebird. jsdom
        # 31.0.0 is fetched from the npm registry into build/jsdom.
        run: python3 tools/conformance/run_dom_conformance.py --reference --quiet
      - name: DOM scoreboard
        run: make dom-conformance
      - name: Enforce the DOM floor
        # The corpus is fixed and timers run on a virtual clock, so the score
        # is deterministic. Every case passes today; one that stops passing is
        # a regression.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_dom_conformance.py --quiet --json build/dom-conformance.json --min-pass 678
      - name: URL scoreboard (web-platform-tests data)
        # tests/url holds the URL parsing and setter cases browsers are tested
        # with. The floor in the Makefile is the number that pass today; the
        # rest are host names outside ASCII (see tests/url/README.md).
        run: make url-conformance
      - uses: actions/upload-artifact@v4
        with:
          name: dom-conformance-report
          path: build/dom-conformance.json
      - name: What failed, as annotations
        # The failed step's output, cut to what matters, where the log
        # cannot be fetched (tools/ci/logged.sh kept it). `shell: bash`: this
        # step is not itself run through logged.sh.
