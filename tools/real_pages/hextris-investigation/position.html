<!doctype html><meta charset="utf-8"><title>Positioned geometry controls</title>
<style>
html,body {margin:0}
#start {position:absolute;left:40%;top:38%;width:25%;height:25%}
#fixed {position:fixed;right:5%;bottom:10%;width:20px;height:30px}
#mixed {position:absolute;left:15%;left:8px;top:-10%;width:40px;height:20px}
#outer {position:relative;margin-left:40px;margin-top:20px;width:180px;height:80px;padding:10px;border:5px solid}
#inner {position:absolute;left:10%;right:15%;top:20%;bottom:30%}
#child {width:16px;height:8px}
#auto {position:absolute;left:15%;left:auto;right:10%;top:0;width:10px;height:10px}
</style>
<div id="start"></div><div id="fixed"></div><div id="mixed"></div><div id="outer"><div id="inner"><div id="child"></div></div><div id="auto"></div></div>
