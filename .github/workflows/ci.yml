name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - name: Engine test suites
        run: make test
      - name: Smoke-test the CLI
        run: ./build/litebird examples/hello.html --dump-dom-webplatform

  conformance:
    name: DOM conformance (html5lib corpus)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: make -j"$(nproc)"
      - name: Tree-construction scoreboard
        run: make conformance
      - name: Enforce the conformance floor
        # The corpus is fixed, so the score is deterministic. Raise this floor as
        # the parser improves; it exists to catch regressions.
        #
        # NOTE: this used to be a bare multi-line `run:` value whose second line
        # started at column 1, which is not valid YAML. The whole workflow file
        # failed to parse, so every run reported "workflow file issue" and no job
        # ever executed. Keep it as a block scalar.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_tree_construction.py --quiet --json build/conformance.json
          python3 -c "import json,sys; r=json.load(open('build/conformance.json')); print(f\"conformance: {r['passed']}/{r['total']} = {r['rate']:.1f}%\"); sys.exit(0 if r['rate'] >= 98.0 else 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: build/conformance.json

  js-conformance:
    name: JavaScript conformance (Node-verified corpus)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # The expectations in tests/js-conformance were recorded with Node 22.
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Check the corpus against Node.js
        # Every expected output must be what a real engine prints. If this step
        # fails, an expectation is wrong; it says nothing about Litebird.
        run: python3 tools/conformance/run_js_conformance.py --reference "node -e" --quiet
      - name: JavaScript scoreboard
        run: make js-conformance
      - name: Enforce the JavaScript floor
        # The corpus is fixed and timers run on a virtual clock, so the score is
        # deterministic. Raise the floor as the engine improves; it exists to
        # catch regressions.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_js_conformance.py --quiet --json build/js-conformance.json --min-pass 834
      - name: String-heavy scripts against Node.js
        # Each script does work in step with its input (read a long string once,
        # append to one many times). The limit is 3 s and the slowest takes a
        # fifth of a second, so this fails on a cost that grows with the square
        # of the length, not on a slow runner. It also compares results.
        run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: js-conformance-report
          path: build/js-conformance.json

  sanitizers:
    name: Address/UB sanitizers + parser fuzzing
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: String stress tests under ThreadSanitizer, then with leak checking
        # Strings are shared between threads without locks; only ThreadSanitizer
        # can check that. It cannot map its shadow memory when the kernel
        # randomises addresses with more than 28 bits, which some runner images do.
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          make tsan
      - name: Sanitizer build, tests and fuzz smoke run
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: make asan
