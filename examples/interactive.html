<!DOCTYPE html>
<html>
<head>
    <title>Dynamic DOM Scripting</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }
        #banner {
            background-color: #1e293b;
            border: 2px #38bdf8;
            padding: 12px;
            margin-bottom: 12px;
        }
        #status-msg {
            color: #fbbf24;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="banner">
        <h1>JavaScript Engine Hooked into DOM</h1>
        <p id="status-msg">Original initial text before JS executes.</p>
    </div>

    <script>
        console.log("=== Running in-page JavaScript script ===");
        let msg = document.getElementById("status-msg");
        if (msg) {
            console.log("Found DOM target node:", msg.tagName, "with id:", msg.id);
            let time = 2026;
            msg.textContent = "Script Executed: DOM manipulated successfully in year " + time + "!";
        }
        console.log("=== In-page script completed ===");
    </script>
</body>
</html>
