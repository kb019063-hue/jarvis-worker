          objects: plain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: make -j"$(nproc)"
      - name: Pages nested 200,000 deep, oversized bitmaps, long runs of one thing
        # 165 generated pages, each nesting or repeating one construct far past
        # what a recursive walk or a quadratic loop survives, then 300 random
        # pages that keep the parser at its nesting limit. Every run is a child
        # process with an 8 MB stack, 2 GB of memory and 60 seconds. The
        # slowest takes 20 to 33 seconds on a quiet two-core machine; what
        # this is here to catch does not finish at all. The machines this job
        # gets differ by a factor of two, so a run that goes over the limit
        # beside the others is run once more by itself before it counts
