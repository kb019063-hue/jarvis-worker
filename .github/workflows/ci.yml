name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - name: Engine test suites
        run: make test
      - name: Smoke-test the CLI
        run: ./build/litebird examples/hello.html --dump-dom-webplatform

  conformance:
    name: DOM conformance (html5lib corpus)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Tree-construction scoreboard
        run: make conformance
      - name: Enforce the conformance floor
        # The corpus is fixed, so the score is deterministic. Raise this floor as
        # the parser improves; it exists to catch regressions.
        #
        # NOTE: this used to be a bare multi-line `run:` value whose second line
        # started at column 1, which is not valid YAML. The whole workflow file
        # failed to parse, so every run reported "workflow file issue" and no job
        # ever executed. Keep it as a block scalar.
        #
        # The floor is the number that pass today: the 11 that do not are all
        # about <select>, and a case that stops passing is a regression.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_tree_construction.py --quiet --json build/conformance.json
          python3 -c "import json,sys; r=json.load(open('build/conformance.json')); print(f\"conformance: {r['passed']}/{r['total']} = {r['rate']:.1f}%\"); sys.exit(0 if r['passed'] >= 1781 else 1)"
      - name: Random pages against parse5
        # The corpus is the inputs somebody wrote. This is 6,000 pages and
        # fragments nobody wrote, a few dozen misnested tags each, parsed here
        # and by parse5: no tree may differ. It is what found that <br/> closed
        # the paragraph it stood in, which no corpus case writes. parse5 8.1.1
        # is fetched from the npm registry into build/parse5 and compared in a
        # copy with nine rules corrected to the standard's
        # (tools/conformance/diff_trees.py says which and why).
        run: make diff-trees
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: build/conformance.json

  js-conformance:
    name: JavaScript conformance (Node-verified corpus)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # The expectations in tests/js-conformance were recorded with Node 22.
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Check the corpus against Node.js
        # Every expected output must be what a real engine prints. If this step
        # fails, an expectation is wrong; it says nothing about Litebird.
        run: python3 tools/conformance/run_js_conformance.py --reference "node -e" --quiet
      - name: JavaScript scoreboard
        run: make js-conformance
      - name: Enforce the JavaScript floor
        # The corpus is fixed and timers run on a virtual clock, so the score is
        # deterministic. Raise the floor as the engine improves; it exists to
        # catch regressions.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_js_conformance.py --quiet --json build/js-conformance.json --min-pass 834
      - name: String-heavy scripts against Node.js
        # Each script does work in step with its input (read a long string once,
        # append to one many times). The limit is 3 s and the slowest takes a
        # fifth of a second, so this fails on a cost that grows with the square
        # of the length, not on a slow runner. It also compares results.
        run: make bench
      - name: String results against Node.js
        # 36 subject strings through every string method and 51 regular
        # expressions: 50,580 results, each compared with what Node computes on
        # the spot. The ceiling in the Makefile is the number that differ
        # today, all of them Unicode data the engine does not have.
        run: make diff-strings
      - uses: actions/upload-artifact@v4
        with:
          name: js-conformance-report
          path: build/js-conformance.json

  dom-conformance:
    name: Script DOM conformance (jsdom-verified corpus) and URLs (web-platform-tests)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # jsdom 31, which recorded the expectations, needs Node 20 or later.
          node-version: "22"
      - name: Build
        run: make -j"$(nproc)"
      - name: Check the corpus against jsdom
        # Every expected output must be what jsdom prints. If this step fails,
        # an expectation is wrong; it says nothing about Litebird. jsdom
        # 31.0.0 is fetched from the npm registry into build/jsdom.
        run: python3 tools/conformance/run_dom_conformance.py --reference --quiet
      - name: DOM scoreboard
        run: make dom-conformance
      - name: Enforce the DOM floor
        # The corpus is fixed and timers run on a virtual clock, so the score
        # is deterministic. Every case passes today; one that stops passing is
        # a regression.
        run: |
          set -euo pipefail
          python3 tools/conformance/run_dom_conformance.py --quiet --json build/dom-conformance.json --min-pass 572
      - name: URL scoreboard (web-platform-tests data)
        # tests/url holds the URL parsing and setter cases browsers are tested
        # with. The floor in the Makefile is the number that pass today; the
        # rest are host names outside ASCII (see tests/url/README.md).
        run: make url-conformance
      - uses: actions/upload-artifact@v4
        with:
          name: dom-conformance-report
          path: build/dom-conformance.json

  deep-pages:
    name: Deep and oversized pages (stack, memory and time limits)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: make -j"$(nproc)"
      - name: Pages nested 200,000 deep, oversized bitmaps, long runs of one thing
        # 145 generated pages, each nesting or repeating one construct far past
        # what a recursive walk or a quadratic loop survives, then 300 random
        # pages that keep the parser at its nesting limit. Every run is a child
        # process with an 8 MB stack, 2 GB of memory and 60 seconds. The
        # slowest takes about 20 seconds on a two-core machine; what this is
        # here to catch does not finish at all.
        run: make deep

  sanitizers:
    name: Address/UB sanitizers + parser fuzzing
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: String stress tests under ThreadSanitizer, then with leak checking
        # Strings are shared between threads without locks; only ThreadSanitizer
        # can check that. It cannot map its shadow memory when the kernel
        # randomises addresses with more than 28 bits, which some runner images do.
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          make tsan
      - name: Sanitizer build, tests, the JavaScript, DOM and URL corpora and a fuzz smoke run
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: make -j"$(nproc)" asan-core
      - name: Deep and oversized pages in the sanitizer build
        # For memory errors on these pages. They are a twentieth as deep as in
        # the deep-pages job, which is the one that looks for recursion: a
        # sanitizer build is several times slower.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: make asan-deep
