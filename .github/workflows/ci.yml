  xml-and-wpt:
    name: XML (W3C suite, Expat and libxml2) and web-platform-tests
    runs-on: ubuntu-latest
    # Not after the last merge of a lot (the top of this file). It is part of
    # the short run.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[objects only]')) }}
    defaults:
      run:
        # A step that fails keeps what it printed, for the last step of the
