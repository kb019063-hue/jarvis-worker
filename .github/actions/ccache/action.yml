name: Compile through ccache
description: >
  Puts ccache in front of g++ and fetches the objects that the last run on
  main compiled, so that a job compiles what its pull request changed and
  not the whole engine again.

# Until 24 November 2026 every one of the eleven jobs that build compiled the
# whole engine from nothing: seven the plain build (85 to 158 seconds) and four
# the sanitizer build (292 to 377 seconds), 37 of the 75 minutes of runner time
# a run took, and the sanitizer build was more than half of the longest job.
# ccache keys an object on the preprocessed source and the compiler's
# arguments, so an object is taken from the cache only when compiling would
# have made the same one.
#
# The objects come from the last run on `main` (a cache saved by a run on the
# default branch can be read by every pull request; one saved by a pull
# request's run can be read by that pull request alone, so those runs save
# none). The jobs "Build & unit tests" and "Sanitizers: unit suites" save
# them, in ci.yml.
#
# One pull request does save its own: a watch's (title `WATCH:`). Its runs
# are the lots, one after another on the same pull request, and each holds
# what `main` is about to be. The lot pushed at 04:13 UTC on 24 November, a
# minute and a half after the one before it had landed, found the objects of
# 03:57, because main's run on what had just landed saved its own at 04:15:
# each of the four sanitizer jobs compiled for 4 min 49 s what the lot before
# had compiled already, and the longest job took 14 min 13 s where it takes
# seven. GitHub looks for a cache in the pull request's own first and in
# main's after, so a lot gets the objects of the lot before it.

inputs:
  objects:
    description: "Which build the objects are of: plain (`make`) or asan (`make asan-build`)"
    required: true

runs:
  using: composite
  steps:
    # The objects first: ccache itself comes with them (the step below).
    - name: The objects of the last run on main
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.objects }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ inputs.objects }}-
    - name: ccache in front of the compiler
      shell: bash
      env:
        # The static binary of the ccache project's own release, held to
        # the SHA-256 that GitHub publishes for the file. (`apt-get install
        # ccache` took 47 seconds of a job, most of it reading package
        # lists; this takes two.)
        CCACHE_RELEASE: 4.14.3
        CCACHE_SHA256: d553fac006ed93a37342cee9228cf4e13dd66690fa1a8075c54c7bace9b72ae6
      run: |
        # A job that cannot get ccache compiles everything, as every job did
        # before. It must not fail for want of it.
        #
        # It is fetched once and then kept beside the objects, in a
        # directory of its own inside the one that is saved (ccache reads
        # and tidies only its sixteen directories 0 to f). Fourteen jobs
        # of a run used to fetch the same file from the project's releases
        # in the same second, and at 02:39 UTC on 25 November one of them
        # was refused: "Sanitizers: fuzzing" compiled the sanitizer build
        # from nothing, 300 seconds where its neighbours took 20 to 51,
        # and the lot was 9.7 minutes for it. In the same run another job
        # took 50 seconds over the fetch.
        bin="$RUNNER_TEMP/ccache-bin"
        kept="$HOME/.ccache/ccache-binary/ccache-$CCACHE_RELEASE"
        from=""
        mkdir -p "$bin"
        if command -v ccache >/dev/null 2>&1; then
          ln -sf "$(command -v ccache)" "$bin/ccache" && from="the runner's own"
        elif [ -x "$kept" ] && "$kept" --version 2>/dev/null | grep -q "ccache version $CCACHE_RELEASE"; then
          cp "$kept" "$bin/ccache" && from="kept with the objects"
        else
          name="ccache-$CCACHE_RELEASE-linux-x86_64-musl-static"
          if curl -fsSL --retry 2 --max-time 60 -o "$RUNNER_TEMP/$name.tar.xz" \
               "https://github.com/ccache/ccache/releases/download/v$CCACHE_RELEASE/$name.tar.xz" \
             && echo "$CCACHE_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum --check --status \
             && tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"; then
            found="$(find "$RUNNER_TEMP/$name" -maxdepth 2 -type f -name ccache | head -n 1)"
            if [ -n "$found" ]; then
              cp "$found" "$bin/ccache" && chmod +x "$bin/ccache" && from="fetched from the project's release"
              # For the job that saves the objects, and so for every job after it.
              mkdir -p "$(dirname "$kept")" && cp "$bin/ccache" "$kept" || true
            fi
          fi
        fi
        if [ -x "$bin/ccache" ] && "$bin/ccache" --version >/dev/null 2>&1; then
          echo "CCACHE_FROM=$from" >> "$GITHUB_ENV"
          # A `g++` that is a link to ccache, first on the PATH: ccache finds
          # the real one behind it, and the Makefile's `CXX ?= g++` and every
          # tool that calls g++ go through it with nothing else changed.
          for compiler in g++ gcc c++ cc; do ln -sf ccache "$bin/$compiler"; done
          echo "$bin" >> "$GITHUB_PATH"
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            # The limit is there so that ccache never tidies up during a
            # build. It tidies each of its sixteen directories by itself
            # when that one is over a sixteenth of the limit, and the
            # objects of the sanitizer build are few and large: 107 of
            # them are 0.45 GB. Under a limit of 500M a build that
            # compiled them all kept 86 (run 45471158220, 24 November;
            # the run after it had 86 hits and 21 misses with nothing
            # changed), and each of the seven sanitizer jobs then compiled
            # the 21 again: 57 to 88 seconds where a build that finds
            # everything takes 3 to 5 (runs 45473629683 and 45478444576).
            # What is kept is decided where the objects are saved
            # (ci.yml, "Only the objects this build used"), not here.
            echo "CCACHE_MAXSIZE=${{ inputs.objects == 'asan' && '2G' || '500M' }}"
            # When this job began to use the cache: see the same step.
            echo "CCACHE_BEGAN=$(date +%s)"
            # The compiler is told apart by what it is, not by when the
            # runner's image installed it.
            echo "CCACHE_COMPILERCHECK=content"
            # A checkout is seconds old when the build begins, and nothing
            # writes a source file during it.
            echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
        else
          echo "::warning title=ccache::ccache could not be fetched; this job compiles everything"
        fi
    - name: Count from here
      shell: bash
      run: ccache --zero-stats >/dev/null 2>&1 || true
